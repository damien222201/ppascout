{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h1>Review a PPA</h1>
  <p class="sub">Help incoming corps members choose well. {{ total_reviews }} reviews logged so far.</p>

  <form method="POST" action="{{ url_for('review') }}" class="form">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required placeholder="you@email.com">
    <p class="hint">Used only to prevent spam — never shown publicly.</p>

    <div class="grid2">
      <div>
        <label for="state">State of deployment</label>
        <select id="state" name="state" required>
          <option value="" disabled selected>Select state</option>
          {% for s in states %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label for="sector">Sector</label>
        <select id="sector" name="sector" required>
          <option value="" disabled selected>Select sector</option>
          {% for code, name in sectors.items() %}<option value="{{ code }}">{{ name }}</option>{% endfor %}
        </select>
      </div>
    </div>

    <label for="ppa_name">PPA name</label>
    <input type="text" id="ppa_name" name="ppa_name" required placeholder="e.g. Government Secondary School, Karu">

    <div class="grid2">
      <div>
        <label for="service_year">Service year</label>
        <select id="service_year" name="service_year" required>
          {% for y in service_years %}<option value="{{ y }}">{{ y }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label for="monthly_topup">Monthly top-up (₦, optional)</label>
        <input type="number" id="monthly_topup" name="monthly_topup" min="0" step="500" placeholder="on top of the federal allawee">
      </div>
    </div>

    <label>Accommodation provided?</label>
    <div class="yn-toggle">
      <input type="radio" id="accYes" name="accommodation_provided" value="yes">
      <label for="accYes" class="yn-label yes">Yes</label>
      <input type="radio" id="accNo" name="accommodation_provided" value="no" checked>
      <label for="accNo" class="yn-label no">No</label>
    </div>

    <label>Overall rating</label>
    <div class="star-row" id="starRow">
      {% for n in range(1,6) %}
      <button type="button" class="star" data-val="{{ n }}">★</button>
      {% endfor %}
    </div>
    <input type="hidden" name="rating" id="ratingInput" required>

    <label for="review_text">Review (optional)</label>
    <textarea id="review_text" name="review_text" rows="3" placeholder="What was it really like — workload, how corps members are treated, anything future corpers should know"></textarea>

    <button type="submit" class="btn-primary">Submit review</button>
  </form>
</section>

<style>
  .yn-toggle{ display:flex; gap:10px; margin-top:4px;}
  .yn-toggle input{ display:none; }
  .yn-label{ margin:0; flex:1; text-align:center; padding:9px; border:1px solid var(--line); border-radius:3px; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft);}
  .yn-toggle input:checked + .yn-label.yes{ background:rgba(63,174,107,0.18); border-color:var(--green); color:var(--green); font-weight:600;}
  .yn-toggle input:checked + .yn-label.no{ background:var(--panel-2); border-color:var(--line); color:var(--ink-soft);}
  .star-row{ display:flex; gap:6px; margin-top:4px;}
  .star{ background:none; border:1px solid var(--line); border-radius:3px; font-size:20px; color:var(--line); cursor:pointer; padding:6px 12px;}
  .star.active{ color:var(--gold); border-color:var(--gold); }
</style>
<script>
  const stars = document.querySelectorAll('.star');
  stars.forEach(star=>{
    star.addEventListener('click', ()=>{
      const val = parseInt(star.dataset.val);
      document.getElementById('ratingInput').value = val;
      stars.forEach(s=> s.classList.toggle('active', parseInt(s.dataset.val) <= val));
    });
  });
</script>
{% endblock %}
