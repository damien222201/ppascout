databases:
  - name: ppascout-db
    plan: free
    databaseName: ppascout
    user: ppascout

services:
  - type: web
    name: ppascout
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ppascout-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
